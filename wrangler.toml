# O nome precisa ser igual ao do Worker na Cloudflare (Workers e Pages > painel---dados).
name = "painel---dados"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Arquivos estáticos do painel. As rotas /api/* passam primeiro pelo Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "DATA"
bucket_name = "rumo-dados"

# Dados do aplicativo no Cloudflare Access (não são secretos).
# Se estiverem vazias, a API recusa tudo com erro 503.
[vars]
ACCESS_TEAM_DOMAIN = "nortemarketing.cloudflareaccess.com"
ACCESS_AUD = "b8265a1aebb8b8dfc2238ddc3e1e3c431cda8753b78256ec3b575802df0b7d0c"
