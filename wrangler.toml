# O nome precisa ser igual ao do Worker na Cloudflare (Workers e Pages > painel---dados).
name = "painel---dados"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Arquivos estáticos do painel. As rotas /api/* passam primeiro pelo Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "DATA"
bucket_name = "rumo-dados"

# Preencha depois de criar o aplicativo no Cloudflare Access (veja o README).
# Enquanto estiverem vazias, a API recusa tudo com erro 503.
[vars]
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
