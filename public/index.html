<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IA e Inovações</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: faixa de comando no topo; resumo antes do detalhe; cada objetivo é um trilho com a marca de onde estava antes. */
:root {
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#162033; --ink2:#47536A; --ink3:#5B677E; --line:#D5DBE6;
  --accent:#2743C2; --accent-soft:#E3E8FB; --on-accent:#FFFFFF; --s1:#2743C2; --s2:#C4802A; --track:#E2E7EF;
  --crit:#AE231B; --crit-soft:#FBE9E7; --warn:#7F5200; --warn-soft:#FBF0D9; --good:#0B6B4A; --good-soft:#DFF3EA;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --s1:#7088F0; --bg:#0F141D; --surface:#18202C; --ink:#E8ECF4; --ink2:#B2BBCB; --ink3:#98A3B6; --line:#2C3646;
  --accent:#8CA2FF; --accent-soft:#232D52; --on-accent:#0F141D; --s2:#B57826; --track:#262F3E;
  --crit:#FF9C93; --crit-soft:#3B1D1B; --warn:#E8BC63; --warn-soft:#33280F; --good:#6AD3A8; --good-soft:#12322A;
  color-scheme:dark } }
:root[data-theme="dark"] {
  --s1:#7088F0; --bg:#0F141D; --surface:#18202C; --ink:#E8ECF4; --ink2:#B2BBCB; --ink3:#98A3B6; --line:#2C3646;
  --accent:#8CA2FF; --accent-soft:#232D52; --on-accent:#0F141D; --s2:#B57826; --track:#262F3E;
  --crit:#FF9C93; --crit-soft:#3B1D1B; --warn:#E8BC63; --warn-soft:#33280F; --good:#6AD3A8; --good-soft:#12322A;
  color-scheme:dark }
* { box-sizing:border-box }
[hidden] { display:none !important }
body { margin:0 }
a.btn { color:var(--ink); text-decoration:none }
body { background:var(--bg); color:var(--ink); font:400 14px/1.5 var(--body); padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:20px 48px }
.wrap { max-width:1240px; margin:0 auto; display:grid; gap:20px }
h1,h2,h3 { margin:0; text-wrap:balance }
h1 { font:700 24px/1.15 var(--display) }
h2 { font:600 18px/1.25 var(--display) }
h3 { font:600 14px/1.35 var(--body) }
p { margin:0 }
.muted { color:var(--ink3) } .small { font-size:12.5px }
.num { font-family:var(--mono); font-variant-numeric:tabular-nums }
button,select,input,textarea { font:inherit; color:inherit }
button { cursor:pointer }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px }

header.top { display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; justify-content:space-between }
.tools { display:flex; flex-wrap:wrap; gap:10px; align-items:center }
nav.tabs { display:flex; gap:4px; overflow-x:auto; border-bottom:1px solid var(--line) }
nav.tabs a { padding:8px 12px; color:var(--ink2); text-decoration:none; font-weight:500; border-bottom:2px solid transparent; white-space:nowrap }
nav.tabs a[aria-current="page"] { color:var(--ink); border-color:var(--accent) }
.btn { background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:6px 12px; font-weight:500 }
.btn:hover { border-color:var(--ink3) }
.btn.pri { background:var(--accent); border-color:var(--accent); color:var(--on-accent) }
.btn.link { background:none; border:none; padding:0; color:var(--accent); font-weight:500; text-decoration:underline; text-underline-offset:2px }
.btn.danger { color:var(--crit) }
.seg-ctl { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--surface) }
.seg-ctl button { border:none; background:none; padding:6px 10px; color:var(--ink2) }
.seg-ctl button[aria-pressed="true"] { background:var(--accent-soft); color:var(--ink); font-weight:600 }
.cmp-label { color:var(--ink3); font-size:12.5px }
body.ro .w { display:none !important }

.banner { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; justify-content:space-between; background:var(--warn-soft); color:var(--ink); border-radius:6px; padding:8px 12px }
.panel { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:16px; min-width:0 }
.panel-head { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:baseline; justify-content:space-between; margin-bottom:12px }
.stack { display:grid; gap:20px; min-width:0 }
.two { display:grid; grid-template-columns:minmax(0,5fr) minmax(0,3fr); gap:20px; align-items:start }
@media (max-width:860px) { .two { grid-template-columns:minmax(0,1fr) } }

.focus { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:flex-start; justify-content:space-between }
.focus .eyebrow, .eyebrow { font:500 11.5px/1.3 var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--ink3) }
.focus p.big { font:600 20px/1.3 var(--display); max-width:60ch; margin-top:4px }

.kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px }
@media (max-width:760px) { .kpis { grid-template-columns:repeat(2,minmax(0,1fr)) } }
.kpi { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:12px 14px; display:grid; gap:2px; align-content:start }
.kpi .v { font:500 28px/1.15 var(--mono); font-variant-numeric:tabular-nums }
.delta { font:500 12px/1.4 var(--mono); color:var(--ink3) }
.delta.good { color:var(--good) } .delta.bad { color:var(--crit) }

.obj { display:grid; gap:6px; padding-block:12px; border-top:1px solid var(--line) }
.obj:first-child, .panel-head + .obj { border-top:none; padding-top:0 }
.obj-title { display:flex; gap:10px; justify-content:space-between; align-items:baseline; flex-wrap:wrap }
.obj button.t { background:none; border:none; padding:0; text-align:left; font-weight:600; font-size:15px }
.obj button.t:hover { text-decoration:underline }
.track { position:relative; height:8px; background:var(--track); border-radius:4px; margin-block:4px }
.fill { position:absolute; inset:0 auto 0 0; background:var(--accent); border-radius:4px }
.tick { position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--ink); box-shadow:0 0 0 1px var(--surface) }
.meta { display:flex; flex-wrap:wrap; gap:2px 12px; color:var(--ink3); font-size:12.5px }

.alert { display:flex; gap:10px; align-items:flex-start; padding-block:8px; border-top:1px solid var(--line); width:100%; background:none; border-inline:none; border-bottom:none; text-align:left }
.alert:first-child { border-top:none; padding-top:0 }
.alert:hover .a-t { text-decoration:underline }
.pill { display:inline-flex; align-items:center; gap:4px; border-radius:4px; padding:1px 7px; font:500 11.5px/1.5 var(--mono); white-space:nowrap; background:var(--track); color:var(--ink2) }
.pill.crit { background:var(--crit-soft); color:var(--crit) } .pill.warn { background:var(--warn-soft); color:var(--warn) } .pill.good { background:var(--good-soft); color:var(--good) } .pill.acc { background:var(--accent-soft); color:var(--ink) }

.people { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr)); gap:14px; align-items:start }
.person-head { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; margin-bottom:10px }
.load { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px }
.row-task { display:grid; gap:2px; width:100%; text-align:left; background:none; border:none; border-top:1px solid var(--line); padding:8px 0 }
.row-task:hover .rt { text-decoration:underline }
.rt { font-weight:500 }
.why { color:var(--ink2); font-size:12.5px }
.why b { font-weight:600; color:var(--ink) }

.filters { display:flex; flex-wrap:wrap; gap:10px; align-items:end }
.filters label { display:grid; gap:2px; font-size:12px; color:var(--ink3); min-width:0 }
.field { background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:6px 8px; max-width:100%; color:var(--ink) }
.board-wrap { overflow-x:auto; padding-bottom:6px }
.board { display:grid; grid-template-columns:repeat(4,minmax(240px,1fr)); gap:12px; align-items:start }
.col { background:color-mix(in srgb,var(--track) 55%,var(--bg)); border-radius:8px; padding:10px; min-height:140px; display:grid; gap:8px; align-content:start }
.col.over { outline:2px dashed var(--accent); outline-offset:-2px }
.col-h { display:flex; justify-content:space-between; font-weight:600; font-size:13px }
.card { background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:9px 10px; display:grid; gap:5px; cursor:pointer; text-align:left; width:100% }
.card:hover { border-color:var(--ink3) }
.card.blocked { border-color:var(--crit) }
.card .chips { display:flex; flex-wrap:wrap; gap:4px }

.chart-plot { position:relative; height:170px; margin-left:26px }
.gl { position:absolute; left:0; right:0; border-top:1px solid var(--line) }
.gl span { position:absolute; left:-26px; top:-9px; width:20px; text-align:right; font:400 11px/1.5 var(--mono); color:var(--ink3) }
.bars { position:absolute; inset:0; display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:6px }
.bar { display:flex; flex-direction:column-reverse; gap:2px; height:100%; padding-inline:12%; border-radius:4px }
.bar:hover,.bar:focus-visible { background:color-mix(in srgb,var(--ink3) 12%,transparent) }
.seg { flex:none; min-height:2px } .seg.s1 { background:var(--s1) } .seg.s2 { background:var(--s2) }
.seg:last-child { border-radius:4px 4px 0 0 }
.xl { display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:6px; margin:4px 0 0 26px; font:400 11px/1.4 var(--mono); color:var(--ink3); text-align:center }
@media (max-width:560px) { .xl span:nth-child(even) { visibility:hidden } }
.legend { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12.5px; color:var(--ink2); margin-top:10px }
.key { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px }
.table-wrap { overflow-x:auto }
table { border-collapse:collapse; width:100% }
th,td { text-align:left; padding:6px 10px 6px 0; border-top:1px solid var(--line); font-size:13px }
th { font-weight:500; color:var(--ink3); border-top:none }
td.n,th.n { text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums }
details summary { cursor:pointer; color:var(--ink2); font-size:12.5px; margin-top:10px }
.changes { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr)); gap:16px; align-items:start }
.changes ul,.steps { margin:6px 0 0; padding:0; list-style:none; display:grid; gap:6px }
.notes { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:16px }
.note dt { font-size:12px; color:var(--ink3); margin-top:8px } .note dd { margin:0; white-space:pre-wrap }
.note dl { margin:0 }
.steps { counter-reset:s; gap:12px; margin-top:12px }
.steps li { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; justify-content:space-between; border-top:1px solid var(--line); padding-top:12px }
.steps li span.n { font:500 13px var(--mono); color:var(--accent); margin-right:8px }
.empty { color:var(--ink3); padding:8px 0 }
table.access { min-width:980px } table.access td { vertical-align:top } table.access a { color:var(--accent); font-weight:500 }
.chips-a { display:flex; flex-wrap:wrap; gap:4px }
.checks { display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:6px }
.form .checks label { display:inline-flex; flex-direction:row; align-items:center; gap:6px; font-weight:400 }

dialog { border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); padding:20px; width:min(600px,calc(100vw - 32px)); max-height:calc(100dvh - 32px) }
dialog::backdrop { background:rgba(10,16,28,.45) }
.form { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; border:none; padding:0; margin:14px 0 0 }
.form label { display:grid; gap:3px; font-size:12.5px; font-weight:500; color:var(--ink2); min-width:0 }
.form .full { grid-column:1/-1 }
.form .field { width:100%; font-weight:400 }
@media (max-width:480px) { .form { grid-template-columns:minmax(0,1fr) } }
.dlg-foot { display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; margin-top:16px }
.dlg-foot div { display:flex; gap:8px }
.err { color:var(--crit); font-size:13px; grid-column:1/-1 }
#tip { position:fixed; z-index:50; background:var(--ink); color:var(--bg); border-radius:6px; padding:6px 9px; font-size:12.5px; pointer-events:none; max-width:260px; white-space:pre-line }
#toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:60; background:var(--ink); color:var(--bg); border-radius:6px; padding:8px 14px; max-width:calc(100vw - 32px) }
@media (prefers-reduced-motion:no-preference) { .fill { transition:width .25s ease } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>IA e Inovações</h1>
      <p class="muted small" id="sub">Para onde vamos, quem faz o quê e por quê.</p>
    </div>
    <div class="tools">
      <span class="cmp-label" id="cmp-label">Comparar com</span>
      <div class="seg-ctl" role="group" aria-labelledby="cmp-label" id="cmp"></div>
      <a class="btn" href="/api/data?download=1">Baixar JSON</a>
      <button class="btn pri w" data-act="new-task" type="button">Nova tarefa</button>
    </div>
  </header>
  <div id="banner"></div>
  <nav class="tabs" id="tabs" aria-label="Seções"></nav>
  <main id="main" class="stack"><p class="muted">Carregando os dados da equipe…</p></main>
</div>

<dialog id="dlg"></dialog>
<div id="tip" hidden></div>
<div id="toast" role="status" hidden></div>

<script>
const DAY = 864e5;
const ST = {a_fazer:'A fazer', andamento:'Em andamento', bloqueada:'Bloqueada', concluida:'Concluída', cancelada:'Cancelada'};
const TIPOS = ['Pipeline / ETL','Dashboard / BI','Análise','Modelo / ML','Qualidade de dados','Infra / plataforma','Sustentação'];
const COLS = ['pessoas','objetivos','tarefas','semanas','acessos'];
const CATS = ['Banco de dados','BI / Dashboards','Cloud','Repositório de código','API / Integração','ERP / Sistema interno','Ferramenta','Outro'];
const ROUTES = {panorama:'Panorama', equipe:'Equipe', tarefas:'Tarefas', objetivos:'Objetivos', evolucao:'Evolução', acessos:'Acessos'};
const PERIODS = {7:'semana passada', 30:'mês passado', 90:'3 meses atrás'};
const PERIOD_SHORT = {7:'Semana', 30:'Mês', 90:'3 meses'};
const PERIOD_IN = {7:'na semana passada', 30:'no mês passado', 90:'há 3 meses'};

let etag = null, writing = Promise.resolve(), readOnly = false, demo = false, demoData = null, phase = 'loading', slow = false;
let live = {pessoas:[], objetivos:[], tarefas:[], semanas:[], acessos:[]};
let period = 7;
const filt = {pessoa:'', objetivo:'', tipo:'', busca:''};
const filtA = {busca:'', cat:'', pessoa:''};
try { const p = +localStorage.getItem('rumo.period'); if (PERIODS[p]) period = p; } catch (e) {}

/* ---------- utilidades ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const ymd = d => { const x = new Date(d); return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate()); };
const fmtD = s => { if (!s) return ''; const [y, m, d] = String(s).slice(0, 10).split('-'); return d + '/' + m + '/' + y; };
const shortD = t => { const x = new Date(t); return pad(x.getDate()) + '/' + pad(x.getMonth() + 1); };
function mondayOf(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); }
function weekKey(t) {
  const d = new Date(t); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const w1 = new Date(d.getFullYear(), 0, 4);
  const n = 1 + Math.round(((d - w1) / DAY - 3 + ((w1.getDay() + 6) % 7)) / 7);
  return d.getFullYear() + '-W' + pad(n);
}
const data = () => demo ? demoData : live;
const hist = t => Array.isArray(t.historico) ? t.historico : [];
function statusAt(t, at) { let s = null; for (const h of hist(t)) if (+new Date(h.em) <= at) s = h.s; return s; }
const isOpen = s => s === 'andamento' || s === 'bloqueada';
function doneAt(t) { if (t.status !== 'concluida') return null; const h = hist(t); for (let i = h.length - 1; i >= 0; i--) if (h[i].s === 'concluida') return +new Date(h[i].em); return null; }
function sinceStatus(t) { const h = hist(t); return h.length ? +new Date(h[h.length - 1].em) : Date.now(); }
function lookups() { const D = data(); return { P: Object.fromEntries(D.pessoas.map(p => [p.id, p])), O: Object.fromEntries(D.objetivos.map(o => [o.id, o])) }; }
const activePeople = () => data().pessoas.filter(p => p.ativo !== false).sort((a, b) => String(a.nome).localeCompare(b.nome, 'pt-BR'));
const activeObjs = () => data().objetivos.filter(o => (o.status || 'ativo') === 'ativo').sort((a, b) => String(a.prazo || '9').localeCompare(String(b.prazo || '9')));

function metrics(at) {
  const { O } = lookups(), ts = data().tarefas.map(t => ({ t, s: statusAt(t, at) })).filter(x => x.s);
  const open = ts.filter(x => isOpen(x.s));
  const linked = open.filter(x => O[x.t.objetivoId]).length;
  return {
    wip: open.length,
    blocked: open.filter(x => x.s === 'bloqueada').length,
    linkedPct: open.length ? Math.round(linked / open.length * 100) : null,
    people: new Set(open.map(x => x.t.pessoaId).filter(Boolean)).size,
    late: ts.filter(x => (isOpen(x.s) || x.s === 'a_fazer') && x.t.prazo && x.t.prazo < ymd(at)).length,
  };
}
const doneBetween = (a, b) => data().tarefas.filter(t => { const d = doneAt(t); return d && d > a && d <= b; });
function objProgress(o, at) {
  const ts = data().tarefas.filter(t => t.objetivoId === o.id).map(t => statusAt(t, at)).filter(s => s && s !== 'cancelada');
  const done = ts.filter(s => s === 'concluida').length;
  return { total: ts.length, done, pct: ts.length ? Math.round(done / ts.length * 100) : 0, open: ts.filter(isOpen).length };
}
function delta(now, then, opt = {}) {
  if (now == null || then == null) return `<span class="delta">sem dado ${esc(PERIOD_IN[period])}</span>`;
  const d = now - then, u = opt.unit || '', vs = opt.vs || PERIODS[period];
  if (!d) return `<span class="delta">= sem mudança vs ${esc(vs)}</span>`;
  const better = opt.good == null ? '' : (d > 0) === (opt.good === 'up') ? 'good' : 'bad';
  return `<span class="delta ${better}">${d > 0 ? '▲ +' : '▼ '}${d}${u} vs ${esc(vs)}</span>`;
}

/* ---------- gravação ---------- */
function toast(msg) { const el = $('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3500); }
const normalize = j => Object.fromEntries(COLS.map(c => [c, Array.isArray(j && j[c]) ? j[c] : []]));
async function fetchData() {
  const r = await fetch('/api/data', { cache: 'no-store', headers: etag ? { 'If-None-Match': etag } : {} });
  if (r.status === 304) return false;
  if (!r.ok) { const e = new Error('http'); e.status = r.status; throw e; }
  const j = await r.json();
  etag = r.headers.get('ETag');
  live = normalize(j);
  return true;
}
/* Grava o arquivo inteiro. Em caso de conflito, busca a versão nova e reaplica só esta alteração. */
function commit(mutate) {
  const run = async () => {
    try {
      for (let i = 0; i < 3; i++) {
        const next = structuredClone(live); mutate(next);
        const r = await fetch('/api/data', { method: 'PUT', headers: { 'Content-Type': 'application/json', ...(etag ? { 'If-Match': etag } : { 'If-None-Match': '*' }) }, body: JSON.stringify(next) });
        if (r.ok) { etag = r.headers.get('ETag'); live = next; if (!demo) render(); return true; }
        if (r.status === 412) { etag = null; await fetchData(); continue; }
        toast(r.status === 401 || r.status === 403 ? 'Sua sessão expirou ou você não tem permissão. Recarregue a página e entre de novo.' : r.status === 413 ? 'O arquivo de dados passou de 5 MB. Exclua registros antigos para continuar.' : 'Não foi possível salvar. Tente de novo em instantes.');
        return false;
      }
      toast('Outras pessoas estão salvando ao mesmo tempo. Tente de novo em instantes.');
      return false;
    } catch (e) { toast('Não foi possível salvar. Verifique a conexão e tente de novo.'); return false; }
  };
  const p = writing.then(run, run);
  writing = p.catch(() => {});
  return p;
}
async function save(col, id, body) {
  if (demo) { const L = demoData[col], i = L.findIndex(x => x.id === id); const doc = { id, ...body }; if (i >= 0) L[i] = doc; else L.push(doc); render(); return true; }

function setStatus(t, s) {

/* ---------- Panorama ---------- */
function attention() {

    if (t.status === 'bloqueada') items.push({ k: 0, c: 'crit', l: 'Bloqueada', t: t.titulo, s: (P[t.pessoaId]?.nome || 'Sem responsável') + (t.bloqueio ? ' · ' + t.bloqueio : ` · há ${Math.floor((now - sinceStatus(t)) / DAY)} dias`), act: 'task', id: t.id });
    else if ((isOpen(t.status) || t.status === 'a_fazer') && t.prazo && t.prazo < today) items.push({ k: 1, c: 'warn', l: 'Atrasada', t: t.titulo, s: (P[t.pessoaId]?.nome || 'Sem responsável') + ' · prazo ' + fmtD(t.prazo), act: 'task', id: t.id });
    else if (t.status === 'andamento' && now - sinceStatus(t) > 14 * DAY) items.push({ k: 2, c: 'warn', l: 'Parada', t: t.titulo, s: `Em andamento há ${Math.floor((now - sinceStatus(t)) / DAY)} dias`, act: 'task', id: t.id });

  }
  for (const p of activePeople()) { const n = D.tarefas.filter(t => t.pessoaId === p.id && isOpen(t.status)).length; if (n >= 5) items.push({ k: 3, c: 'warn', l: 'Sobrecarga', t: p.nome, s: `${n} tarefas abertas ao mesmo tempo`, act: 'person', id: p.id }); }
  for (const o of activeObjs()) { const q = objProgress(o, now); if (!q.open && q.pct < 100) items.push({ k: 3, c: 'warn', l: 'Sem ninguém', t: o.titulo, s: 'Objetivo ativo sem tarefa em andamento', act: 'objective', id: o.id }); }
  return items.sort((a, b) => a.k - b.k);
}

/* ---------- Evolução ---------- */

  const max = Math.max(4, ...weeks.map(w => w.s1 + w.s2)), top = Math.ceil(max / 2) * 2;
  const totalAll = weeks.slice(-4).reduce((n, w) => n + w.s1 + w.s2, 0), linkedAll = weeks.slice(-4).reduce((n, w) => n + w.s1, 0);
  const head = totalAll ? `Nas últimas 4 semanas, ${Math.round(linkedAll / totalAll * 100)}% do que foi concluído estava ligado a um objetivo.` : 'Ainda não há tarefas concluídas nas últimas 4 semanas.';
  return `<section class="panel"><div class="panel-head"><h2>Entregas por semana</h2><span class="small muted">Tarefas concluídas, últimas 12 semanas</span></div>
    <p style="margin-bottom:14px">${esc(head)}</p>

      <div class="bars">${weeks.map(w => `<div class="bar" tabindex="0" data-tip="${esc(`Semana de ${shortD(w.a)}${w.cur ? ' (em curso)' : ''}\nLigadas a objetivo: ${w.s1}\nAvulsas: ${w.s2}`)}">${w.s1 ? `<div class="seg s1" style="height:${w.s1 / top * 100}%"></div>` : ''}${w.s2 ? `<div class="seg s2" style="height:${w.s2 / top * 100}%"></div>` : ''}</div>`).join('')}</div>
    </div>
    <div class="xl">${weeks.map(w => `<span>${shortD(w.a)}</span>`).join('')}</div>
    <div class="legend"><span><i class="key" style="background:var(--s1)"></i>Ligadas a objetivo</span><span><i class="key" style="background:var(--s2)"></i>Avulsas</span></div>

  </section>`;
}

function openForm({ title, fields, onSave, onDelete, deleteLabel }) {
  const dlg = $('dlg');
  dlg.innerHTML = `<form id="dlg-form"><h2>${esc(title)}</h2><fieldset class="form" ${readOnly ? 'disabled' : ''}>${fields}<p class="err" id="dlg-err" hidden></p></fieldset>

    <div><button class="btn" id="dlg-cancel" type="button">${readOnly ? 'Fechar' : 'Cancelar'}</button>${readOnly ? '' : '<button class="btn pri" type="submit">Salvar</button>'}</div></div></form>`;
  $('dlg-cancel').onclick = () => dlg.close();
  const del = $('dlg-del');
  if (del) del.onclick = async () => { if (del.dataset.armed) { if (await onDelete()) dlg.close(); } else { del.dataset.armed = '1'; del.textContent = 'Confirmar exclusão'; } };
  $('dlg-form').onsubmit = async e => {
    e.preventDefault();
    if (readOnly) return dlg.close();
    const err = onValidate(new FormData(e.target));
    if (err) { const el = $('dlg-err'); el.textContent = err; el.hidden = false; return; }
    if (await onSave(Object.fromEntries(new FormData(e.target)))) dlg.close();
  };
  function onValidate(fd) { return openForm.check ? openForm.check(Object.fromEntries(fd)) : ''; }
  dlg.showModal();
}

const VIEWS = { panorama: viewPanorama, equipe: viewEquipe, tarefas: viewTarefas, objetivos: viewObjetivos, evolucao: viewEvolucao, acessos: viewAcessos };

function act(a, id) {

  if (a === 'task') { const t = D.tarefas.find(x => x.id === id); if (t) taskForm(t); }
  else if (a === 'new-task') taskForm(null);
  else if (a === 'objective') { const o = D.objetivos.find(x => x.id === id); if (o) objectiveForm(o); }

  else if (a === 'new-person') personForm(null);

  else if (a === 'new-access') accessForm(null);

document.addEventListener('dragleave', e => { const c = e.target.closest?.('.col'); if (c && !c.contains(e.relatedTarget)) c.classList.remove('over'); });
document.addEventListener('drop', e => { const c = e.target.closest?.('.col'); if (!c) return; e.preventDefault(); c.classList.remove('over'); const t = data().tarefas.find(x => x.id === e.dataTransfer.getData('text/plain')); if (t) setStatus(t, c.dataset.col); });
function showTip(el, x, y) { const tip = $('tip'); tip.textContent = el.dataset.tip; tip.hidden = false; const r = tip.getBoundingClientRect(); tip.style.left = Math.max(8, Math.min(innerWidth - r.width - 8, x + 12)) + 'px'; tip.style.top = Math.max(8, y - r.height - 10) + 'px'; }
document.addEventListener('mousemove', e => { const el = e.target.closest?.('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else $('tip').hidden = true; });
document.addEventListener('focusin', e => { if (e.target.dataset?.tip) { const r = e.target.getBoundingClientRect(); showTip(e.target, r.left, r.top); } });
document.addEventListener('focusout', () => { $('tip').hidden = true; });
addEventListener('hashchange', render);
